name: Backfill Daily Ops Metrics

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to backfill (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
      chunk_days:
        description: "Days per Metabase fetch chunk (smaller = safer against timeouts on heavy reports, slower overall)"
        required: false
        default: "7"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests gspread

      - name: Run backfill
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_EMAIL: ${{ secrets.METABASE_EMAIL }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DAILY_OPS_BACKFILL_CHUNK_DAYS: ${{ github.event.inputs.chunk_days }}
        run: python backfill_daily_ops_metrics.py --start "${{ github.event.inputs.start_date }}"

      - name: Upload chunk cache (debugging aid, not required for correctness)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ops-backfill-cache
          path: .cache/daily_ops_backfill_chunks/
          if-no-files-found: ignore
