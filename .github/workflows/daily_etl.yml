name: Yulu Daily ETL

on:
  # On-demand refresh without needing GitHub UI/API access: committing a
  # change to .github/refresh-now.txt runs the same Daily Ops Metrics +
  # Cluster Utilization pass as the scheduled 9 AM/12 PM slots.
  push:
    branches: [main]
    paths:
      - ".github/refresh-now.txt"
  schedule:
    # 1:00 AM IST = 19:30 UTC (previous day) -- normal full daily ETL.
    - cron: "30 19 * * *"
    # 9:00 AM IST = 03:30 UTC, and 12:00 PM IST = 06:30 UTC -- Daily Ops
    # Metrics AND Cluster Utilization Snapshot. Moved from the earlier
    # 1 PM/9 PM slots per explicit request. The 1 AM run above no longer
    # computes either of these (etl_yulu.py's main() deliberately skips
    # both on the normal daily path) -- their underlying source data
    # isn't reliably settled that early. Each of these two passes
    # recomputes and overwrites a trailing multi-day window
    # (DAILY_OPS_REFRESH_WINDOW_DAYS in etl_yulu.py) for Daily Ops
    # Metrics, not just yesterday alone -- the source data keeps drifting
    # for more than a single day after the fact, so a date needs to be
    # re-touched across more than one calendar day to actually catch up
    # with it. Cluster Utilization Snapshot only ever captures "today"
    # (its source sheet has no history), so the 12 PM pass simply
    # overwrites the 9 AM pass's snapshot with a more-settled one.
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"
    # GitHub starts `schedule` runs HOURS late for this repo (measured over
    # several days: the 9 AM and 12 PM slots above actually start ~2:50-3:30
    # PM and ~5:20-6:30 PM IST). These two slots are therefore scheduled
    # EARLY, and the run holds itself until the real target time if it
    # happens to start before it (hold_until_ist.sh), so the data lands at
    # 9 AM / 12 PM IST whether GitHub is on time or several hours late. The
    # two slots above stay as later fallback refreshes -- every pass is
    # idempotent (it overwrites the same rolling window).
    #   03:53 IST (22:23 UTC prev day) -> holds until 09:00 IST
    #   06:37 IST (01:07 UTC)          -> holds until 12:00 IST
    - cron: "23 22 * * *"
    - cron: "7 1 * * *"
  workflow_dispatch: # allows manual trigger from GitHub UI
    inputs:
      daily_ops_backfill_start:
        description: "Optional: backfill Daily Ops Metrics from this date (YYYY-MM-DD) instead of the normal daily ETL"
        required: false
        default: ""
      daily_ops_backfill_end:
        description: "Optional: end date for the backfill (YYYY-MM-DD). Defaults to yesterday."
        required: false
        default: ""
      daily_ops_backfill_overwrite:
        description: "Overwrite mode: delete + recompute EVERY date in range (not just missing ones) — use after a fix to the per-date math itself so already-backfilled history picks it up"
        required: false
        type: boolean
        default: false
      daily_ops_metrics_only:
        description: "Run ONLY Daily Ops Metrics + Cluster Utilization Snapshot right now (same as the 9 AM/12 PM schedule), ignored if a backfill start date is also set above -- use this to force today's refresh on demand instead of waiting on (or in case GitHub delayed/skipped) the scheduled 9 AM/12 PM run"
        required: false
        type: boolean
        default: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    # A run that starts early sleeps up to ~5h10m before doing its ~4 min of work.
    timeout-minutes: 345

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same on-disk-cache model as Mechanics>60 Audit / Cluster KPI in the
      # reference sync script: closed calendar months are cached here so a
      # Daily Ops Metrics backfill re-run (or one that extends its end
      # date) never re-fetches a month it already has. Restored/saved
      # automatically by actions/cache -- no code change needed to benefit
      # from it. Harmless (and just restores nothing) on a normal daily
      # run, which never touches this directory.
      - name: Restore Daily Ops Metrics month cache
        uses: actions/cache@v4
        with:
          path: .cache/daily_ops_months
          key: daily-ops-months-cache-${{ github.run_id }}
          restore-keys: |
            daily-ops-months-cache-

      - name: Run ETL
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_EMAIL: ${{ secrets.METABASE_EMAIL }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BACKFILL_START: ${{ github.event.inputs.daily_ops_backfill_start }}
          BACKFILL_END: ${{ github.event.inputs.daily_ops_backfill_end }}
          BACKFILL_OVERWRITE: ${{ github.event.inputs.daily_ops_backfill_overwrite }}
          # True for either an actual scheduled 9 AM/12 PM firing, OR a
          # manual run with the daily_ops_metrics_only checkbox ticked --
          # the latter exists because GitHub's cron schedule is best-effort
          # and can be delayed by hours or skipped outright (confirmed
          # live, repeatedly), so a manual trigger with blank inputs
          # otherwise falls through to the normal 1 AM-style full-ETL path
          # (which deliberately never computes Daily Ops Metrics at all)
          # instead of actually running what was needed.
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          IS_METRICS_ONLY_SCHEDULE: ${{ (github.event_name == 'schedule' && (github.event.schedule == '30 3 * * *' || github.event.schedule == '30 6 * * *' || github.event.schedule == '23 22 * * *' || github.event.schedule == '7 1 * * *')) || github.event_name == 'push' || github.event.inputs.daily_ops_metrics_only == 'true' }}
        run: |
          if [ -n "$BACKFILL_START" ]; then
            ARGS=(--daily-ops-backfill-start "$BACKFILL_START")
            if [ -n "$BACKFILL_END" ]; then
              ARGS+=(--daily-ops-backfill-end "$BACKFILL_END")
            fi
            if [ "$BACKFILL_OVERWRITE" = "true" ]; then
              ARGS+=(--daily-ops-backfill-overwrite)
            fi
            python etl_yulu.py "${ARGS[@]}"
          elif [ "$IS_METRICS_ONLY_SCHEDULE" = "true" ]; then
            case "$EVENT_SCHEDULE" in
              "23 22 * * *") bash .github/scripts/hold_until_ist.sh 03:50 09:00 ;;
              "7 1 * * *")   bash .github/scripts/hold_until_ist.sh 06:30 12:00 ;;
            esac
            python etl_yulu.py --daily-ops-metrics-only
          else
            python etl_yulu.py
          fi
