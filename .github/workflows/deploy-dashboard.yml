name: Build & Deploy Ops Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  schedule:
    # Fallback safety net only — the workflow_run trigger below is what
    # actually keeps the dashboard fresh day to day (rebuilds immediately
    # after every "Yulu Daily ETL" run, scheduled or manual/backfill).
    # 20:00 UTC = 1:30 AM IST, in case that trigger is ever missed.
    - cron: "0 20 * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Yulu Daily ETL"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Only proceed on a workflow_run trigger if the ETL run it followed
    # actually succeeded -- a failed/cancelled ETL run has nothing new
    # worth rebuilding the dashboard from. Every other trigger (push,
    # schedule, manual dispatch) always proceeds.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread

      - name: Build data.js
        working-directory: dashboard
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python build_data.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
